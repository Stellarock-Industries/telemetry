name: Build & release

# Every push to main: test, give it the next version number, build the Windows installer + portable exe,
# and publish them as a GitHub Release. Nothing to tag or bump by hand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch: {}

permissions:
  contents: write            # needed to create the release (and its tag)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Next version
        id: ver
        run: |
          # major.minor come from package.json (edit those yourself for a bigger release); the patch is the run number
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VER="$BASE.${{ github.run_number }}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          npm pkg set repository="https://github.com/${{ github.repository }}"   # tells the built app where to look for updates
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - run: npm ci || npm install
      - run: npm test
      - run: npm run dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "v${{ steps.ver.outputs.version }}" dist/*.exe dist/latest.yml dist/*.blockmap \
            --title "Stellarock Telemetry v${{ steps.ver.outputs.version }}" \
            --generate-notes --latest
