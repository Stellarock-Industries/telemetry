
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: telemetry-app
        run: npm ci

      - name: Run tests
        working-directory: telemetry-app
        run: npm test

      - name: Build application
        working-directory: telemetry-app
        run: npm run dist

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-FileHash telemetry-app/dist/*.exe -Algorithm SHA256 |
            ForEach-Object {
              "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
            } |
            Out-File telemetry-app/dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: stellarock-telemetry-windows
          path: telemetry-app/dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stellarock Telemetry ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            telemetry-app/dist/*.exe
            telemetry-app/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
